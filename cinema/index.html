<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cena 1, take 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,700;1,6..96,400&family=Courier+Prime&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="flash" id="flash" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>

<main class="screen flicker" id="screen">
  <div class="slate-wrap" id="slateWrap">
    <button class="slate" id="slate" aria-label="Bater a claquete e começar">
      <svg viewBox="0 0 360 290" aria-hidden="true">
        <g id="stick">
          <rect x="10" y="20" width="340" height="44" fill="#111"/>
          <g fill="#F1EADF">
            <polygon points="30,20 70,20 50,64 10,64"/><polygon points="110,20 150,20 130,64 90,64"/>
            <polygon points="190,20 230,20 210,64 170,64"/><polygon points="270,20 310,20 290,64 250,64"/>
          </g>
        </g>
        <rect x="10" y="66" width="340" height="40" fill="#111"/>
        <g fill="#F1EADF"><polygon points="30,66 70,66 50,106 10,106"/><polygon points="110,66 150,66 130,106 90,106"/>
          <polygon points="190,66 230,66 210,106 170,106"/><polygon points="270,66 310,66 290,106 250,106"/></g>
        <rect x="10" y="108" width="340" height="176" fill="#161514" stroke="#F1EADF" stroke-width="2"/>
        <g font-family="Courier Prime, monospace" fill="#F1EADF">
          <text x="24" y="138" font-size="13" opacity=".6">PRODUÇÃO</text>
          <text x="24" y="160" font-size="18">uma festa qualquer</text>
          <line x1="10" y1="174" x2="350" y2="174" stroke="#F1EADF" stroke-width="1" opacity=".5"/>
          <text x="24" y="200" font-size="13" opacity=".6">CENA</text><text x="24" y="226" font-size="26">1</text>
          <line x1="130" y1="174" x2="130" y2="284" stroke="#F1EADF" stroke-width="1" opacity=".5"/>
          <text x="144" y="200" font-size="13" opacity=".6">TAKE</text><text x="144" y="226" font-size="26">1</text>
          <line x1="240" y1="174" x2="240" y2="284" stroke="#F1EADF" stroke-width="1" opacity=".5"/>
          <text x="254" y="200" font-size="13" opacity=".6">ROLO</text><text x="254" y="226" font-size="26">∞</text>
          <line x1="10" y1="240" x2="350" y2="240" stroke="#F1EADF" stroke-width="1" opacity=".5"/>
          <text x="24" y="268" font-size="13" opacity=".6">LOCAÇÃO</text>
          <text x="104" y="268" font-size="15">Av. Paulista, SP</text>
        </g>
      </svg>
    </button>
    <p class="tap">toque na claquete</p>
  </div>
  <div id="stage" aria-live="polite"></div>
</main>
<button class="skip" id="skip">pular ›</button>

<script src="script.js"></script>
</body>
</html>
