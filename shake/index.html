<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suplemento do Davi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="main">
  <h1>Pré-treino do Davi</h1>
  <p class="status" id="status">sacode o shaker pra misturar o whey</p>

  <div class="shaker-zone" id="zone" tabindex="0" role="button" aria-label="Shaker. Arraste para sacudir, ou aperte espaço várias vezes.">
    <div class="shaker" id="shaker">
      <svg viewBox="0 0 200 330" aria-hidden="true">
        <defs>
          <clipPath id="cup"><path d="M52,74 L148,74 L138,302 Q137,314 125,314 L75,314 Q63,314 62,302 Z"/></clipPath>
        </defs>
        <g class="steam" transform="translate(0,-6)">
          <path d="M80,50 q-10,-14 0,-28 q10,-14 0,-28"/>
          <path d="M100,46 q-10,-14 0,-28 q10,-14 0,-28"/>
          <path d="M120,50 q-10,-14 0,-28 q10,-14 0,-28"/>
        </g>
        <g clip-path="url(#cup)">
          <rect x="40" y="74" width="120" height="250" fill="var(--plastic)"/>
          <rect id="liquid" x="40" y="250" width="120" height="80" fill="#D9B48F"/>
          <path id="wave" d="M40,250 q15,-6 30,0 t30,0 t30,0 t30,0 v8 h-120 z" fill="#D9B48F"/>
        </g>
        <path d="M52,74 L148,74 L138,302 Q137,314 125,314 L75,314 Q63,314 62,302 Z" fill="none" stroke="var(--ink)" stroke-width="4"/>
        <g stroke="var(--ink)" stroke-width="2" opacity=".35">
          <line x1="130" y1="120" x2="140" y2="120"/><line x1="130" y1="160" x2="139" y2="160"/>
          <line x1="130" y1="200" x2="138" y2="200"/><line x1="130" y1="240" x2="137" y2="240"/>
        </g>
        <g id="label">
          <rect x="66" y="168" width="68" height="72" rx="8" fill="var(--ink)"/>
          <text id="labelA" x="100" y="212" text-anchor="middle" font-family="Anton, Impact, sans-serif" font-size="24" fill="#fff">WHEY</text>
          <text id="labelB1" x="100" y="200" text-anchor="middle" font-family="Anton, Impact, sans-serif" font-size="17" fill="#fff" opacity="0">LEITE</text>
          <text id="labelB2" x="100" y="224" text-anchor="middle" font-family="Anton, Impact, sans-serif" font-size="17" fill="#FF6A2B" opacity="0">QUENTE</text>
        </g>
        <g id="lid">
          <rect x="46" y="44" width="108" height="34" rx="9" fill="var(--flame)"/>
          <rect x="84" y="26" width="32" height="22" rx="6" fill="var(--flame)"/>
          <rect x="46" y="70" width="108" height="8" fill="rgba(0,0,0,.15)"/>
        </g>
      </svg>
    </div>
  </div>

  <div class="meter" aria-hidden="true">
    <div class="bar"><div class="fill" id="fill"></div></div>
    <small id="pct">mistura: 0%</small>
  </div>
  <button class="motion-btn" id="motionBtn">Liberar sacudida no celular</button>
</main>

<div class="reveal" id="reveal" aria-live="polite">
  <p class="tease" id="tease">uhuum… então tu gosta de leite quente, né? 🤨</p>
  <div class="note" id="note">
    <p class="from">no fundo do copo tinha isso:</p>
    <p class="msg">eu sei que você gosta dessas coisas, mas ainda é meu irmão. tmjt</p>
    <p class="sign">— Vinical</p>
    <button class="again" id="again">Sacudir de novo</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
